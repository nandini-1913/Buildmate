name: customerapp
description: "BuildMate 24x7 customer mobile application."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  provider: ^6.1.5+1
  http: ^1.2.2
  shared_preferences: ^2.5.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  file_picker: ^13.1.0
  web: ^1.1.1
  geolocator: ^14.0.1
  geocoding: ^5.0.0
  path_provider: ^2.1.5
  open_file: ^3.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/branding/
    - assets/images/categories/
    - assets/images/brands/
    - assets/images/pipes/
    - assets/images/professions/
